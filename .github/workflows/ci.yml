name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install the built wheel with its actual converter and Flip
        run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[markitdown]" 'flip-notebook==0.22.0'
      - name: Unit tests and real capture, extraction, and recheck integration
        env:
          FLIP_TEST_BIN: flip
        run: python -m unittest discover -s tests -v
      - run: flip-documents --version
      - name: Validate the installed bundle
        run: flip plugin doctor "$(flip-documents --plugin-path)"
