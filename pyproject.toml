[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flip-documents"
version = "0.1.0"
description = "Preserve original document downloads and adapt local Markdown extraction"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
markitdown = ["markitdown[docx,xlsx,pptx,pdf]>=0.1.3,<0.2"]

[project.scripts]
flip-documents = "flip_documents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flip_documents"]

[tool.hatch.build.targets.wheel.force-include]
"flip-plugin.toml" = "flip_documents/bundle/flip-plugin.toml"
"README.md" = "flip_documents/bundle/README.md"
"LICENSE" = "flip_documents/bundle/LICENSE"
"workflows" = "flip_documents/bundle/workflows"
"skills" = "flip_documents/bundle/skills"
"examples" = "flip_documents/bundle/examples"
